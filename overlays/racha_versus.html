<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        
        body { 
            margin: 0; padding: 20px; overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            background: transparent; 
        }

        .ranking-container {
            display: flex; flex-direction: column; gap: 18px;
            width: 390px;
        }

        .user-row {
            display: flex; align-items: center; gap: 12px;
            transition: all 0.3s ease;
        }

        .user-row.mirror { flex-direction: row-reverse; }
        .user-row.mirror .info-col { align-items: flex-end; }
        .user-row.mirror .name-row { flex-direction: row-reverse; }

        /* Contenedor del icono de GG y Rosa */
        .team-gift-badge {
            width: 38px; height: 38px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 9px;
            flex-shrink: 0;
            padding: 3px;
            box-sizing: border-box;
        }

        .team-1 .team-gift-badge {
            background: rgba(0, 255, 102, 0.16);
            border: 2px solid #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.45);
        }

        .team-2 .team-gift-badge {
            background: rgba(255, 0, 60, 0.16);
            border: 2px solid #ff003c;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.45);
        }

        .team-gift-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.7));
        }

        .avatar-container {
            position: relative;
            width: 52px; height: 52px;
            flex-shrink: 0;
        }

        .avatar { 
            box-sizing: border-box; 
            width: 100%; height: 100%; 
            border-radius: 50%; object-fit: cover; 
            border: 2.5px solid transparent; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .team-1 .avatar { border-color: #00ff66; box-shadow: 0 0 14px rgba(0, 255, 102, 0.75); }
        .team-2 .avatar { border-color: #ff003c; box-shadow: 0 0 14px rgba(255, 0, 60, 0.75); }

        .info-col { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; }
        
        .name-row { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            flex-wrap: nowrap;
            white-space: nowrap; 
        }
        
        .name { 
            color: #fff; font-size: 16px; font-weight: 900; 
            text-transform: uppercase; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px; 
            letter-spacing: 0.5px;
        }

        .team-1 .name {
            color: #00ff66;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.5), 2px 2px 2px rgba(0,0,0,0.9);
        }

        .team-2 .name {
            color: #ff003c;
            text-shadow: 0 0 8px rgba(255, 0, 60, 0.5), 2px 2px 2px rgba(0,0,0,0.9);
        }
        
        .win-badge {
            display: flex; align-items: center; gap: 4px;
            font-size: 12px; font-weight: 900;
            padding: 2px 6px; border-radius: 4px;
            color: white;
        }
        .win-badge i { color: #ffd700; }
        .win-badge-1 { background: #00b848; box-shadow: 0 0 8px rgba(0,255,102,0.5); }
        .win-badge-2 { background: #d60032; box-shadow: 0 0 8px rgba(255,0,60,0.5); }

        .coins-row {
            display: flex; align-items: center; gap: 6px;
            color: #ffd700; font-size: 16px; font-weight: 900;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .coin-icon {
            color: #ffd700; font-size: 14px;
            text-shadow: 0 0 5px rgba(255,215,0,0.5);
        }

        .dummy-row { opacity: 0.42; filter: grayscale(100%); }
        .dummy-row .name { color: #aaa !important; text-shadow: 1px 1px 2px rgba(0,0,0,0.8) !important; font-size: 14px; }
        .dummy-row .coins-row, .dummy-row .coin-icon { color: #888; text-shadow: none; }
        .dummy-row .avatar { border-color: #444 !important; box-shadow: none !important; background: #222; }
        .dummy-row .team-gift-badge { background: #222 !important; border-color: #444 !important; box-shadow: none !important; }
    </style>
</head>
<body>
    <div class="ranking-container" id="ranking-box"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('ranking-box');

        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 32 32' fill='%23666'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

        const DEFAULT_GG_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 95">
                <defs>
                    <linearGradient id="ggFill" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffe600"/>
                        <stop offset="42%" stop-color="#ffffff"/>
                        <stop offset="55%" stop-color="#ff5ec4"/>
                        <stop offset="100%" stop-color="#ff006a"/>
                    </linearGradient>
                    <linearGradient id="ggStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00e1ff"/>
                        <stop offset="50%" stop-color="#7a00ff"/>
                        <stop offset="100%" stop-color="#ff006a"/>
                    </linearGradient>
                </defs>
                <g font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="68" paint-order="stroke fill">
                    <text x="6" y="74" stroke="url(#ggStroke)" stroke-width="14" stroke-linejoin="round" fill="none">GG</text>
                    <text x="6" y="74" stroke="#1a0033" stroke-width="6" stroke-linejoin="round" fill="url(#ggFill)">GG</text>
                </g>
            </svg>
        `);

        const DEFAULT_ROSE_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <path d="M50 58 L62 94" stroke="#1e9e46" stroke-width="8" stroke-linecap="round"/>
                <path d="M55 72 Q78 60 82 74 Q68 84 55 72 Z" fill="#2ecc71" stroke="#11662b" stroke-width="3"/>
                <path d="M52 76 Q26 70 22 83 Q38 90 52 76 Z" fill="#27ae60" stroke="#11662b" stroke-width="3"/>
                <path d="M20 40 C14 16, 48 6, 52 20 C60 6, 86 16, 80 42 C75 62, 56 70, 48 68 C34 70, 24 58, 20 40 Z" fill="#ff1e56" stroke="#7a001e" stroke-width="3.5"/>
                <path d="M28 36 C32 20, 66 20, 70 38 C66 52, 34 52, 28 36 Z" fill="#ff5c8a" stroke="#a30029" stroke-width="2.5"/>
                <path d="M38 34 C44 26, 58 26, 60 35 C56 43, 42 42, 38 34 Z" fill="#ff9ebb" stroke="#d11d53" stroke-width="2"/>
            </svg>
        `);

        let currentConfig = null;
        let configOpciones = { showName: true, showCount: true, showCoins: true, mirrorMode: false };
        let histData = { salvadas: {}, reinicios: {} };
        let topEq1 = null;
        let topEq2 = null;

        function obtenerIconoEquipo(numEquipo) {
            let fallback = numEquipo === 1 ? DEFAULT_GG_ICON : DEFAULT_ROSE_ICON;
            if (!currentConfig) return fallback;

            let equipo = numEquipo === 1 ? currentConfig.equipo1 : currentConfig.equipo2;
            let catalogo = currentConfig.regalosDisponibles || [];

            if (equipo && Array.isArray(equipo.regalos) && equipo.regalos.length > 0) {
                let preferido = equipo.regalos.find(r => Number(r.diamonds) === 1) || equipo.regalos[0];
                if (preferido) {
                    if (preferido.image && preferido.image.trim() !== '') return preferido.image;
                    let enCat = catalogo.find(c => Number(c.id) === Number(preferido.id));
                    if (enCat && enCat.image && enCat.image.trim() !== '') return enCat.image;
                }
            }
            return fallback;
        }

        socket.on('config_actual', (config) => {
            currentConfig = config;
            renderOverlay();
        });

        socket.on('racha_versus_update', (data) => {
            if(!data) return;
            configOpciones.showName = data.showName !== false;
            configOpciones.showCount = data.showCount !== false;
            configOpciones.showCoins = data.showCoins !== false;
            configOpciones.mirrorMode = !!data.mirrorMode;
            
            histData.salvadas = data.salvadas || {};
            histData.reinicios = data.reinicios || {};

            if (data.topActualSalvar !== undefined) topEq1 = data.topActualSalvar;
            if (data.topActualReiniciar !== undefined) topEq2 = data.topActualReiniciar;
            renderOverlay();
        });

        socket.on('racha_versus_clear_visual', () => {
            topEq1 = null;
            topEq2 = null;
            renderOverlay();
        });

        function renderTeamRow(teamNum, userObj) {
            const mirrorClass = configOpciones.mirrorMode ? 'mirror' : '';
            const teamClass = teamNum === 1 ? 'team-1' : 'team-2';
            const giftIconUrl = obtenerIconoEquipo(teamNum);
            const fallbackIcon = teamNum === 1 ? DEFAULT_GG_ICON : DEFAULT_ROSE_ICON;
            const dummyLabel = teamNum === 1 ? 'TOP 1 SALVAR' : 'TOP 1 RESET';

            if (userObj && userObj.coins > 0) {
                const cleanName = userObj.name.replace(/[^a-zA-Z0-9\sÁÉÍÓÚáéíóúÑñ]/g, '').trim() || userObj.name;
                const histMap = teamNum === 1 ? histData.salvadas : histData.reinicios;
                const userHist = histMap[userObj.userKey] || histMap[userObj.name];
                const winsCount = userHist ? (userHist.count || 0) : 0;

                // La copa solo se muestra cuando ya ganó al menos 1 ronda cerrada manualmente
                const winBadgeHtml = (winsCount > 0 && configOpciones.showCount)
                    ? `<span class="win-badge ${teamNum === 1 ? 'win-badge-1' : 'win-badge-2'}"><i class="fa-solid fa-trophy"></i> x${winsCount}</span>`
                    : '';

                const nameHtml = configOpciones.showName ? `<span class="name">${cleanName}</span>` : '';
                const coinsHtml = configOpciones.showCoins
                    ? `<div class="coins-row"><i class="fa-solid fa-coins coin-icon"></i> ${userObj.coins.toLocaleString()}</div>`
                    : '';

                return `
                    <div class="user-row ${teamClass} ${mirrorClass}">
                        <div class="team-gift-badge">
                            <img src="${giftIconUrl}" class="team-gift-icon" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fallbackIcon}';">
                        </div>
                        <div class="avatar-container">
                            <img src="${userObj.avatar || defaultAvatar}" class="avatar" onerror="this.src='${defaultAvatar}'">
                        </div>
                        <div class="info-col">
                            <div class="name-row">${nameHtml}${winBadgeHtml}</div>
                            ${coinsHtml}
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="user-row ${teamClass} dummy-row ${mirrorClass}">
                        <div class="team-gift-badge">
                            <img src="${giftIconUrl}" class="team-gift-icon" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${fallbackIcon}';">
                        </div>
                        <div class="avatar-container">
                            <img src="${defaultAvatar}" class="avatar">
                        </div>
                        <div class="info-col">
                            <div class="name-row"><span class="name">${dummyLabel}</span></div>
                            <div class="coins-row"><i class="fa-solid fa-coins coin-icon"></i> 0</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderOverlay() {
            container.innerHTML = renderTeamRow(1, topEq1) + renderTeamRow(2, topEq2);
        }

        renderOverlay();
    </script>
</body>
</html>
