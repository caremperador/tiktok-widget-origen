<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pop de Regalos Versus</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Fondo transparente para OBS */
            font-family: 'Luckiest Guy', cursive;
        }

        .pop-text {
            position: absolute;
            font-size: 60px;
            font-weight: normal;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            /* Contorno ultra grueso para que resalte en cualquier fondo */
            -webkit-text-stroke: 2.5px black;
            paint-order: stroke fill;
            /* El translate -50% asegura que el punto de anclaje sea el centro del texto */
            transform: translate(-50%, -50%);
            /* La animación durará 1.2 segundos en total */
            animation: popAndFloat 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 100;
        }

        /* Animación: Aparece de golpe (Pop), flota hacia arriba y se desvanece */
        @keyframes popAndFloat {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.3) rotate(5deg); opacity: 1; }
            40% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            80% { transform: translate(-50%, calc(-50% - 80px)) scale(1); opacity: 1; }
            100% { transform: translate(-50%, calc(-50% - 150px)) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let audioCtx = null;

        // Variables por defecto iniciales
        let nombreEq1 = "SALVAR";
        let nombreEq2 = "RESET";
        let colorEq1 = "#00ff66";
        let colorEq2 = "#ff003c";

        // Escuchamos la configuración en tiempo real del servidor
        socket.on('config_actual', (config) => {
            if (config) {
                // Sincronización robusta: Lee el subtexto, la acción de unidades o el nombre principal en orden de prioridad
                if (config.equipo1) {
                    nombreEq1 = config.equipo1.sub || config.equipo1.actionText || config.equipo1.nombre || "SALVAR";
                    colorEq1 = config.equipo1.color || "#00ff66";
                }
                if (config.equipo2) {
                    nombreEq2 = config.equipo2.sub || config.equipo2.actionText || config.equipo2.nombre || "RESET";
                    colorEq2 = config.equipo2.color || "#ff003c";
                }
            }
        });

        // 🔊 Sintetizador de sonido ASMR "POP"
        function playPopSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = "sine";
                
                const freqBase = 700 + Math.random() * 200; 
                osc.frequency.setValueAtTime(freqBase, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.07);
                
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {
                console.log("No se pudo reproducir el sonido pop", e);
            }
        }

        // 🎯 Escuchamos cada vez que se suman puntos a la batalla clásica
        socket.on('poder_salvar', (data) => {
            playPopSound();
            crearTextoFlotante(data.side, data.amount);
        });

        // ✍️ Función que genera el texto flotante en pantalla
        function crearTextoFlotante(equipo, cantidad) {
            const popText = document.createElement('div');
            popText.className = 'pop-text';
            
            if (equipo === 'salvar') {
                popText.innerText = `+${cantidad} ${nombreEq1}`.trim();
                popText.style.color = colorEq1;
                popText.style.textShadow = `4px 4px 0px #000, 0 0 20px ${colorEq1}`;
            } else {
                popText.innerText = `+${cantidad} ${nombreEq2}`.trim();
                popText.style.color = colorEq2;
                popText.style.textShadow = `4px 4px 0px #000, 0 0 20px ${colorEq2}`;
            }

            const randomX = 45 + Math.random() * 10; 
            const randomY = 50 + Math.random() * 15; 

            popText.style.left = `${randomX}vw`;
            popText.style.top = `${randomY}vh`;

            document.body.appendChild(popText);

            setTimeout(() => {
                popText.remove();
            }, 1500);
        }
    </script>
</body>
</html>
