<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Lilita+One&family=Luckiest+Guy&family=Montserrat:ital,wght@0,700;0,900;1,900&family=Oswald:wght@700&family=Russo+One&family=Teko:wght@600&family=Lemon&display=swap');
        
        body {
            margin: 0; padding: 0; background-color: transparent; 
            color: white; overflow: hidden;
            font-family: 'Luckiest Guy', cursive, sans-serif;
        }
        
        .widget-wrapper { width: 100vw; height: 100vh; position: relative; }
        
        .countdown-line1, .countdown-line2, .countdown-number, #winner-title, #winner-name, .eq-num, .eq-label, .super-action-text, .super-qty-badge { 
            paint-order: stroke fill; 
            -webkit-text-stroke-linejoin: round;
        }

        .countdown-zone {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        /* 📌 MODO NORMAL: LÍNEA 1 POSICIÓN 100% FIJA E INMÓVIL (Arriba: 32%) */
        .countdown-line1 { 
            position: absolute;
            top: 32%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            font-weight: 900; letter-spacing: 2px; z-index: 2; 
            text-align: center; display: flex; align-items: center; justify-content: center;
            white-space: nowrap;
        }

        .equation-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 100px;
        }

        .eq-num {
            color: #ffea00;
            line-height: 1;
            display: inline-block;
            font-size: 1.32em;
            margin-right: -2px;
            transform: translateY(2px);
        }

        .eq-gift-img {
            height: 1.28em;
            width: auto;
            min-height: 54px;
            max-height: 95px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.55));
        }

        .eq-label {
            color: #ffffff;
            line-height: 1;
            display: inline-block;
            font-size: 1.08em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transform: translateY(2px);
        }

        /* 📌 MODO NORMAL: BLOQUE DE CUENTA ATRÁS ABAJO (Fijo en top: 47%) */
        .countdown-bottom-block {
            position: absolute;
            top: 47%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 2;
            white-space: nowrap;
        }

        .countdown-line2 { 
            font-weight: 900; 
            letter-spacing: 2px;
            text-align: center; 
            line-height: 1.05;
            margin-bottom: -2px;
            text-transform: uppercase;
        }
        
        .countdown-number { 
            font-weight: 900; 
            line-height: 0.95;
            text-align: center;
        }

        /* ⚡ MODO SÚPER RESET: SIEMPRE ABAJO (Misma coordenada exacta top: 47%) */
        #super-reset-zone {
            position: absolute;
            top: 47%;
            left: 50%;
            transform: translateX(-50%);
            transform-origin: top center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 4;
            white-space: nowrap;
        }

        .super-timer-badge {
            background: linear-gradient(180deg, #fff633 0%, #ffc400 100%);
            border: 4px solid #000000;
            border-radius: 14px;
            padding: 3px 26px 1px 26px;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.75),
                0 5px 0 #000000, 
                0 8px 18px rgba(0, 0, 0, 0.65),
                0 0 20px rgba(255, 215, 0, 0.55);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            animation: superPulse 0.95s ease-in-out infinite;
        }

        .super-timer-num {
            color: #000000;
            font-family: 'Montserrat', 'Luckiest Guy', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 46px;
            line-height: 1;
            letter-spacing: 1px;
        }

        .super-gift-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0px 0 -4px 0;
            animation: superFloat 2s ease-in-out infinite;
        }

        .super-gift-img {
            height: 105px;
            width: auto;
            max-width: 145px;
            object-fit: contain;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.75)) drop-shadow(0 0 14px rgba(255, 230, 0, 0.35));
        }

        .super-qty-badge {
            font-size: 48px;
            color: #ffea00;
            -webkit-text-stroke: 6.5px #000000;
            text-shadow: 0 4px 0 #000000;
            margin-right: 4px;
            line-height: 1;
        }

        .super-action-text {
            color: #ffea00;
            font-size: 40px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.02;
            letter-spacing: 2px;
            -webkit-text-stroke: 7px #000000;
            text-shadow: 0 4px 0 #000000, 0 6px 12px rgba(0,0,0,0.85);
            z-index: 2;
        }

        @keyframes superPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes superFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        #winner-zone {
            position: absolute;
            top: 47%; left: 50%; transform: translateX(-50%);
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 100%; z-index: 5;
        }
        #winner-avatar {
            width: 110px; height: 110px;
            border-radius: 50%; border: 5px solid #ff003c; object-fit: cover; margin-bottom: 5px; box-shadow: 0 0 20px #ff003c;
        }
        #winner-title {
            font-size: 55px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-align: center;
            -webkit-text-stroke: 2.5px black; line-height: 1.1; margin-bottom: 2px;
        }
        #winner-name {
            font-size: 26px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; text-align: center;
            color: #ffffff; -webkit-text-stroke: 1.5px black;
            max-width: 350px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }

        #canvas-effects { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>
    <canvas id="canvas-effects"></canvas>
    
    <div class="widget-wrapper">
        <div class="countdown-zone" id="countdown-display">
            <!-- MODO NORMAL: Línea 1 Fija arriba (32%) -->
            <div class="countdown-line1" id="countdown-line1-text"></div>
            
            <!-- MODO NORMAL: Bloque inferior independiente (47%) -->
            <div class="countdown-bottom-block" id="countdown-bottom-block">
                <div class="countdown-line2" id="countdown-line2-text">REINICIANDO EN</div>
                <div class="countdown-number" id="timer">30</div>
            </div>

            <!-- ⚡ MODO SÚPER RESET: SIEMPRE ABAJO (47%) -->
            <div id="super-reset-zone">
                <div class="super-timer-badge">
                    <span class="super-timer-num" id="super-timer">30</span>
                </div>
                <div class="super-gift-wrap">
                    <span class="super-qty-badge" id="super-qty" style="display:none;">2</span>
                    <img id="super-gift-img" class="super-gift-img" src="https://i.imgur.com/ssCEDme.png">
                    <img id="super-gift-img2" class="super-gift-img" src="https://i.imgur.com/7982rrb.png" style="display:none;">
                </div>
                <div class="super-action-text" id="super-action-text">SALVAR</div>
            </div>
            
            <div id="winner-zone">
                <img id="winner-avatar" src="https://via.placeholder.com/150/222/fff?text=?">
                <div id="winner-title">¡TE REINICIÓ!</div>
                <div id="winner-name">EL EQUIPO 2</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const DEFAULT_CAPIBARA_IMG = "https://i.imgur.com/OdX4lkD.png";
        const DEFAULT_DONA_IMG = "https://i.imgur.com/Wwy2Kzf.png";
        const DEFAULT_SANDIA_IMG = "https://i.imgur.com/ssCEDme.png";
        const DEFAULT_CORAL_IMG = "https://i.imgur.com/7982rrb.png";

        let currentConfig = {
            equipo1: {
                nombre: "EQUIPO 1",
                nombreSingular: "CAPIBARA",
                nombrePlural: "CAPIBARAS",
                color: "#00ff66",
                imgUnidad: DEFAULT_CAPIBARA_IMG
            },
            equipo2: {
                nombre: "EQUIPO 2",
                nombreSingular: "DONA",
                nombrePlural: "DONAS",
                color: "#ff003c",
                imgUnidad: DEFAULT_DONA_IMG
            },
            enableCountdown: true,
            countdownSeconds: 30,
            superReset: {
                enabled: true,
                countdownSeconds: 30,
                customText: "SALVAR",
                imgSalvar: DEFAULT_SANDIA_IMG,
                imgSalvar2: DEFAULT_CORAL_IMG,
                displayMode: "img1",
                regalosSalvar: [],
                regalosReiniciar: []
            },
            battleStyle: {
                fontFamily: "'Luckiest Guy', cursive",
                textStroke: 2.5,
                shadowOpacity: 0.85,
                shadowDistance: 4,
                superScale: 100,
                colorL1: "#ffea00",
                sizeL1: 52,
                colorL2: "#ff0055",
                sizeL2: 30,    /* Por defecto como está ahora, pero 100% libre para agrandar o achicar */
                colorTimer: "#ffffff",
                sizeTimer: 82  /* Por defecto como está ahora, pero 100% libre para agrandar o achicar */
            }
        };

        let timer = 30;
        let countdownInterval = null;
        let superTimer = 30;
        let superCountdownInterval = null;

        let audioCtx = null;
        let isGameOver = false; 
        let wasLosing = false;
        let wasSuperLosing = false;
        let latestData = { totalSalvar: 0, totalReiniciar: 0, totalSuperSalvar: 0, totalSuperReiniciar: 0 }; 

        function playAlertSound(isSuper = false) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = isSuper ? "sawtooth" : "sine";
                osc.frequency.setValueAtTime(isSuper ? 1050 : 800, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(isSuper ? 420 : 300, audioCtx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {} 
        }

        function playCoinSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function applyDesign(style) {
            if (!style) return;
            document.body.style.fontFamily = style.fontFamily || "'Luckiest Guy', cursive";
            
            let baseStroke = parseFloat(style.textStroke) || 2.5;
            let strokePx = Math.max(baseStroke * 3.5, 4); 

            const l1 = document.getElementById('countdown-line1-text');
            let finalSizeL1 = parseInt(style.sizeL1) || 52;
            l1.style.fontSize = finalSizeL1 + "px";
            l1.style.webkitTextStroke = strokePx + "px #000000";

            // Toma directamente el valor que pongas en el panel (por defecto 30px)
            let finalSizeL2 = parseInt(style.sizeL2) || 30;
            const l2 = document.getElementById('countdown-line2-text');
            l2.style.color = style.colorL2 || "#ff0055"; 
            l2.style.fontSize = finalSizeL2 + "px";
            l2.style.webkitTextStroke = (strokePx * (finalSizeL2 / 42)) + "px #000000";

            // Toma directamente el valor que pongas en el panel (por defecto 82px)
            let finalSizeTimer = parseInt(style.sizeTimer) || 82;
            const lt = document.getElementById('timer');
            lt.style.color = style.colorTimer || "#ffffff"; 
            lt.style.fontSize = finalSizeTimer + "px";
            lt.style.webkitTextStroke = (strokePx * (finalSizeTimer / 78)) + "px #000000";

            // Escala configurable para todo el bloque de Súper Reset (por defecto 100%)
            let superScaleVal = (parseFloat(style.superScale) || 100) / 100;
            const superZone = document.getElementById('super-reset-zone');
            superZone.style.transform = `translateX(-50%) scale(${superScaleVal})`;

            const superAction = document.getElementById('super-action-text');
            superAction.style.color = style.colorL1 || "#ffea00";
            superAction.style.webkitTextStroke = (strokePx * 0.9) + "px #000000";

            const op = style.shadowOpacity !== undefined ? style.shadowOpacity : 0.85;
            const dist = style.shadowDistance !== undefined ? style.shadowDistance : 4;
            const shadowColor = `rgba(0,0,0,${op})`;

            l1.style.textShadow = `0px ${dist}px 0px #000000, 0px ${dist + 2}px 8px${shadowColor}`;
            l2.style.textShadow = `0px ${Math.max(dist - 1, 2)}px 0px #000000, 0px ${dist}px 6px${shadowColor}`;
            lt.style.textShadow = `0px ${dist}px 0px #000000, 0 0 22px rgba(255, 0, 85, 0.8), 0 0 8px rgba(255, 0, 60, 0.6)`;
            superAction.style.textShadow = `0px ${dist}px 0px #000000, 0px ${dist + 2}px 8px${shadowColor}`;
        }

        applyDesign(currentConfig.battleStyle);
        procesarActualizacionVisual(latestData);

        socket.on('config_actual', (config) => {
            if(config && config.unidades) {
                let sConf = config.unidades.superReset || {};
                currentConfig = {
                    ...currentConfig,
                    ...config.unidades,
                    equipo1: {
                        ...currentConfig.equipo1,
                        ...(config.unidades.equipo1 || {}),
                        imgUnidad: (config.unidades.equipo1?.imgUnidad && config.unidades.equipo1.imgUnidad.trim() !== "")
                            ? config.unidades.equipo1.imgUnidad.trim()
                            : DEFAULT_CAPIBARA_IMG
                    },
                    equipo2: {
                        ...currentConfig.equipo2,
                        ...(config.unidades.equipo2 || {}),
                        imgUnidad: (config.unidades.equipo2?.imgUnidad && config.unidades.equipo2.imgUnidad.trim() !== "")
                            ? config.unidades.equipo2.imgUnidad.trim()
                            : DEFAULT_DONA_IMG
                    },
                    superReset: {
                        ...currentConfig.superReset,
                        ...sConf,
                        countdownSeconds: sConf.countdownSeconds || 30,
                        customText: (sConf.customText && sConf.customText.trim() !== "")
                            ? sConf.customText.trim()
                            : "SALVAR",
                        imgSalvar: (sConf.imgSalvar && sConf.imgSalvar.trim() !== "")
                            ? sConf.imgSalvar.trim()
                            : DEFAULT_SANDIA_IMG,
                        imgSalvar2: (sConf.imgSalvar2 && sConf.imgSalvar2.trim() !== "")
                            ? sConf.imgSalvar2.trim()
                            : DEFAULT_CORAL_IMG,
                        displayMode: sConf.displayMode || "img1"
                    },
                    battleStyle: {
                        ...currentConfig.battleStyle,
                        ...(config.unidades.battleStyle || {})
                    }
                };
            }
            applyDesign(currentConfig.battleStyle);
            procesarActualizacionVisual(latestData);
        });

        function clearAllTimers() {
            if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
            if (superCountdownInterval) { clearInterval(superCountdownInterval); superCountdownInterval = null; }
        }

        function triggerGameOver(topReiniciar, isSuper = false) {
            isGameOver = true;
            clearAllTimers();

            if (!topReiniciar || topReiniciar.name === 'ESPERANDO' || topReiniciar.name === 'MANUAL') {
                socket.emit('reset_unidades');
                setTimeout(() => {
                    isGameOver = false;
                    if (latestData) {
                        wasLosing = latestData.totalReiniciar > latestData.totalSalvar;
                        wasSuperLosing = (latestData.totalSuperReiniciar || 0) > (latestData.totalSuperSalvar || 0);
                        procesarActualizacionVisual(latestData);
                    }
                }, 200);
                return;
            }
            
            document.getElementById('countdown-line1-text').style.display = 'none';
            document.getElementById('countdown-bottom-block').style.display = 'none';
            document.getElementById('super-reset-zone').style.display = 'none';
            
            let c2 = currentConfig.equipo2.color || "#ff003c";
            let cleanName = topReiniciar.name.replace(/[^a-zA-Z0-9\sÁÉÍÓÚáéíóúÑñ]/g, '').trim();

            let winnerImg = document.getElementById('winner-avatar');
            let winnerTitle = document.getElementById('winner-title');
            let winnerName = document.getElementById('winner-name');

            winnerImg.src = topReiniciar.avatar ? topReiniciar.avatar : 'https://via.placeholder.com/150/222/fff?text=?';
            winnerImg.style.borderColor = c2;
            winnerImg.style.boxShadow = `0 0 20px ${c2}`;
            
            winnerTitle.innerText = isSuper ? `¡SÚPER RESET!` : `¡TE REINICIÓ!`;
            winnerTitle.style.color = c2;
            winnerName.innerText = cleanName;
            winnerName.style.color = "#ffffff";
            
            const op = currentConfig.battleStyle?.shadowOpacity !== undefined ? currentConfig.battleStyle.shadowOpacity : 1.0;
            const dist = currentConfig.battleStyle?.shadowDistance !== undefined ? currentConfig.battleStyle.shadowDistance : 4;
            
            winnerTitle.style.textShadow = `${dist}px${dist}px 0px rgba(0,0,0,${op}), 0 0 20px${c2}`;
            winnerName.style.textShadow = `${dist}px ${dist}px 0px rgba(0,0,0,${op})`;

            document.getElementById('winner-zone').style.display = 'flex';
            socket.emit('reset_unidades');

            setTimeout(() => {
                isGameOver = false;
                document.getElementById('winner-zone').style.display = 'none';
                if (latestData) {
                    wasLosing = latestData.totalReiniciar > latestData.totalSalvar;
                    wasSuperLosing = (latestData.totalSuperReiniciar || 0) > (latestData.totalSuperSalvar || 0);
                    procesarActualizacionVisual(latestData);
                }
            }, 3000);
        }

        function triggerSaved(topSalvar, isSuper = false) {
            isGameOver = true;
            clearAllTimers();

            document.getElementById('countdown-line1-text').style.display = 'none';
            document.getElementById('countdown-bottom-block').style.display = 'none';
            document.getElementById('super-reset-zone').style.display = 'none';

            let c1 = currentConfig.equipo1.color || "#00ff66";
            let cleanName = topSalvar.name.replace(/[^a-zA-Z0-9\sÁÉÍÓÚáéíóúÑñ]/g, '').trim();

            let winnerImg = document.getElementById('winner-avatar');
            let winnerTitle = document.getElementById('winner-title');
            let winnerName = document.getElementById('winner-name');

            winnerImg.src = topSalvar.avatar ? topSalvar.avatar : 'https://via.placeholder.com/150/222/fff?text=?';
            winnerImg.style.borderColor = c1;
            winnerImg.style.boxShadow = `0 0 20px ${c1}`;
            
            winnerTitle.innerText = isSuper ? `¡SÚPER SALVADA!` : `¡TE SALVÓ!`;
            winnerTitle.style.color = c1;
            winnerName.innerText = cleanName;
            winnerName.style.color = "#ffffff";
            
            const op = currentConfig.battleStyle?.shadowOpacity !== undefined ? currentConfig.battleStyle.shadowOpacity : 1.0;
            const dist = currentConfig.battleStyle?.shadowDistance !== undefined ? currentConfig.battleStyle.shadowDistance : 4;
            winnerTitle.style.textShadow = `${dist}px${dist}px 0px rgba(0,0,0,${op}), 0 0 20px${c1}`;
            winnerName.style.textShadow = `${dist}px ${dist}px 0px rgba(0,0,0,${op})`;

            document.getElementById('winner-zone').style.display = 'flex';

            setTimeout(() => {
                isGameOver = false;
                document.getElementById('winner-zone').style.display = 'none';
                if (latestData) {
                    wasLosing = latestData.totalReiniciar > latestData.totalSalvar; 
                    wasSuperLosing = (latestData.totalSuperReiniciar || 0) > (latestData.totalSuperSalvar || 0);
                    procesarActualizacionVisual(latestData);
                }
            }, 3000);
        }

        socket.on('actualizacion_unidades', (data) => {
            latestData = data;
            procesarActualizacionVisual(data);
        });

        function renderEquationHTML(amount, imgUrl, fallbackName, actionWord) {
            let numColor = currentConfig?.battleStyle?.colorL1 || "#ffea00";
            let showNumber = amount > 1;
            let numberSpan = showNumber ? `<span class="eq-num" style="color:${numColor};">${amount}</span>` : ``;

            if (imgUrl && imgUrl !== "") {
                return `
                    <div class="equation-row">
                        ${numberSpan}
                        <img src="${imgUrl}" class="eq-gift-img">
                        <span class="eq-label">= ${actionWord}</span>
                    </div>
                `;
            } else {
                return `
                    <div class="equation-row">
                        ${numberSpan}
                        <span class="eq-label">${fallbackName} = ${actionWord}</span>
                    </div>
                `;
            }
        }

        function updateSuperImages() {
            let sr = currentConfig.superReset || {};
            let img1Url = (sr.imgSalvar && sr.imgSalvar.trim() !== "") ? sr.imgSalvar.trim() : DEFAULT_SANDIA_IMG;
            let img2Url = (sr.imgSalvar2 && sr.imgSalvar2.trim() !== "") ? sr.imgSalvar2.trim() : DEFAULT_CORAL_IMG;
            let mode = sr.displayMode || "img1";

            let el1 = document.getElementById('super-gift-img');
            let el2 = document.getElementById('super-gift-img2');

            if (mode === "img2") {
                el1.src = img2Url;
                el1.style.display = "inline-block";
                el2.style.display = "none";
            } else if (mode === "both") {
                el1.src = img1Url;
                el2.src = img2Url;
                el1.style.display = "inline-block";
                el2.style.display = "inline-block";
            } else {
                el1.src = img1Url;
                el1.style.display = "inline-block";
                el2.style.display = "none";
            }
        }

        function procesarActualizacionVisual(data) {
            if(!currentConfig || isGameOver) return;

            let salvarPts = data ? (data.totalSalvar || 0) : 0;
            let reiniciarPts = data ? (data.totalReiniciar || 0) : 0;
            let superSalvarPts = data ? (data.totalSuperSalvar || 0) : 0;
            let superReiniciarPts = data ? (data.totalSuperReiniciar || 0) : 0;

            let srConfig = currentConfig.superReset || { enabled: true, countdownSeconds: 30, customText: "SALVAR", imgSalvar: DEFAULT_SANDIA_IMG, imgSalvar2: DEFAULT_CORAL_IMG };
            let isSuperLosing = (srConfig.enabled !== false) && (superReiniciarPts > superSalvarPts);

            if (wasSuperLosing && !isSuperLosing && superSalvarPts > 0) {
                wasSuperLosing = false;
                if (data.topSuperSalvar && data.topSuperSalvar.name !== 'ESPERANDO' && data.topSuperSalvar.name !== 'MANUAL') {
                    triggerSaved(data.topSuperSalvar, true);
                    return;
                }
            }
            wasSuperLosing = isSuperLosing;

            let line1 = document.getElementById('countdown-line1-text');
            let bottomBlock = document.getElementById('countdown-bottom-block');
            let timerEl = document.getElementById('timer');
            let superZone = document.getElementById('super-reset-zone');
            let superTimerEl = document.getElementById('super-timer');

            // ⚡ PRIORIDAD ABSOLUTA: MODO SÚPER RESET ACTIVO
            if (isSuperLosing) {
                if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
                line1.style.display = 'none';
                bottomBlock.style.display = 'none';

                let superDiff = superReiniciarPts - superSalvarPts;
                let qtyEl = document.getElementById('super-qty');
                if (superDiff > 1) {
                    qtyEl.innerText = superDiff;
                    qtyEl.style.display = 'inline-block';
                } else {
                    qtyEl.style.display = 'none';
                }

                updateSuperImages();
                document.getElementById('super-action-text').innerText = srConfig.customText || "SALVAR";
                superZone.style.display = 'flex';

                if (!superCountdownInterval) {
                    superTimer = parseInt(srConfig.countdownSeconds) || 30;
                    superTimerEl.innerText = superTimer;

                    superCountdownInterval = setInterval(() => {
                        superTimer--;
                        playAlertSound(true);

                        if (superTimer <= 0) {
                            superTimer = 0;
                            triggerGameOver(latestData.topSuperReiniciar, true);
                        }
                        if (!isGameOver) superTimerEl.innerText = superTimer;
                    }, 1000);
                }
                return;
            }

            if (superCountdownInterval) { clearInterval(superCountdownInterval); superCountdownInterval = null; }
            superZone.style.display = 'none';

            // MODO NORMAL (DONAS VS CAPIBARAS)
            let isLosing = reiniciarPts > salvarPts;
            
            if (wasLosing && !isLosing && salvarPts > 0) {
                wasLosing = false; 
                if (data.topSalvar && data.topSalvar.name !== 'ESPERANDO' && data.topSalvar.name !== 'MANUAL') {
                    triggerSaved(data.topSalvar, false);
                    return; 
                }
            }
            wasLosing = isLosing; 

            line1.style.display = 'flex';

            let imgCapibara = (currentConfig.equipo1?.imgUnidad && currentConfig.equipo1.imgUnidad.trim() !== "") 
                ? currentConfig.equipo1.imgUnidad.trim() 
                : DEFAULT_CAPIBARA_IMG;

            let imgDona = (currentConfig.equipo2?.imgUnidad && currentConfig.equipo2.imgUnidad.trim() !== "") 
                ? currentConfig.equipo2.imgUnidad.trim() 
                : DEFAULT_DONA_IMG;

            // 🔴 ESCENARIO NORMAL 1: VA GANANDO EL EQUIPO 2
            if (reiniciarPts > salvarPts) {
                let diff = reiniciarPts - salvarPts;
                let nom1 = (diff === 1) ? (currentConfig.equipo1.nombreSingular || "CAPIBARA") : (currentConfig.equipo1.nombrePlural || "CAPIBARAS");

                line1.innerHTML = renderEquationHTML(diff, imgCapibara, nom1, "SALVAR");

                if (currentConfig.enableCountdown !== false) {
                    bottomBlock.style.display = 'flex';

                    if (!countdownInterval) {
                        timer = currentConfig.countdownSeconds || 30; 
                        timerEl.innerText = timer;
                        
                        countdownInterval = setInterval(() => {
                            timer--;
                            playAlertSound(false); 
                            
                            if (timer <= 0) { 
                                timer = 0; 
                                triggerGameOver(latestData.topReiniciar, false); 
                            }
                            if (!isGameOver) timerEl.innerText = timer;
                        }, 1000);
                    }
                } else {
                    bottomBlock.style.display = 'none';
                }
            } 
            // 🟢 ESCENARIO NORMAL 2: EMPATE (0-0) O VENTAJA EQUIPO 1
            else {
                if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
                bottomBlock.style.display = 'none'; 

                let diff2 = (salvarPts - reiniciarPts) + 1;
                let nom2 = (diff2 === 1) ? (currentConfig.equipo2.nombreSingular || "DONA") : (currentConfig.equipo2.nombrePlural || "DONAS");

                line1.innerHTML = renderEquationHTML(diff2, imgDona, nom2, "RESET");
            }
        }

        const canvas = document.getElementById('canvas-effects');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];

        function createExplosion(x, y, color, amount) {
            let particleCount = Math.min(amount * 5 + 10, 80); 
            for(let i=0; i < particleCount; i++) { particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 0.5) * 25, life: 1.0, color: color, size: Math.random() * 8 + 3 }); }
        }

        socket.on('poder_salvar_unidades', (data) => {
            playCoinSound(); 
            let x = canvas.width / 2; let color = 'white'; let y = canvas.height / 2; 
            if(data.side === 'salvar') {
                x = (50 / 100) * canvas.width - 20; color = currentConfig.equipo1.color || '#00ff66'; 
            } else if (data.side === 'reiniciar') {
                x = (50 / 100) * canvas.width + 20; color = currentConfig.equipo2.color || '#ff003c'; 
            }
            createExplosion(x, y, color, data.amount);
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.life -= 0.025; 
                if(p.life <= 0) particles.splice(i, 1);
                else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.globalAlpha = 1.0; requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
