<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Luckiest+Guy&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background: transparent;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        .queue-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 430px;
        }

        .order-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(95deg, rgba(16, 18, 30, 0.92) 0%, rgba(24, 28, 46, 0.88) 100%);
            border: 2px solid rgba(0, 242, 254, 0.55);
            border-left: 6px solid #00f2fe;
            border-radius: 50px;
            padding: 6px 14px 6px 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65), 0 0 12px rgba(0, 242, 254, 0.2);
            animation: cardSlideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: transform 0.25s ease, opacity 0.3s ease, border-color 0.25s ease, background 0.25s ease;
            overflow: hidden;
        }

        /* Efecto de rebote cuando el combo sube (ej. de x1 a x10) */
        .order-card.combo-bump {
            animation: comboPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-color: #ffea00;
            box-shadow: 0 0 22px rgba(255, 234, 0, 0.55);
        }

        /* Estado cuando lo tachas con check */
        .order-card.completed {
            background: linear-gradient(95deg, rgba(8, 45, 24, 0.92) 0%, rgba(14, 65, 34, 0.88) 100%);
            border-color: #00ff66;
            border-left-color: #00ff66;
            transform: scale(0.96) translateX(18px);
            opacity: 0.25;
        }

        .order-card.completed .user-name,
        .order-card.completed .action-pill {
            text-decoration: line-through;
        }

        .left-block {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .avatar-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00f2fe;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .text-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .user-line {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .user-name {
            font-size: 14px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            max-width: 135px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        .sent-label {
            font-size: 11px;
            font-weight: 700;
            color: #9ab0c7;
            text-transform: uppercase;
        }

        .action-pill {
            font-family: 'Luckiest Guy', cursive;
            font-size: 21px;
            color: #00ff66;
            letter-spacing: 1px;
            line-height: 1.05;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000000;
            paint-order: stroke fill;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(0, 255, 102, 0.45);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .right-gift-block {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.45);
            padding: 4px 10px 4px 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            flex-shrink: 0;
        }

        .gift-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }

        .combo-qty {
            font-family: 'Luckiest Guy', cursive;
            font-size: 26px;
            color: #ffea00;
            -webkit-text-stroke: 2px #000000;
            paint-order: stroke fill;
            text-shadow: 2px 3px 0px #000000;
            line-height: 1;
            transform: translateY(1px);
        }

        .check-overlay-badge {
            display: none;
            position: absolute;
            right: 14px;
            background: #00ff66;
            color: #000;
            font-weight: 900;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 0 12px #00ff66;
            z-index: 5;
        }

        .order-card.completed .check-overlay-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        @keyframes cardSlideIn {
            0% { opacity: 0; transform: translateX(-30px) scale(0.9); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes comboPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="queue-wrapper" id="queue-box"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('queue-box');
        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 32 32' fill='%23666'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

        let previousCounts = new Map();
        let audioCtx = null;

        function playBellSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = "triangle";
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {}
        }

        socket.on('cola_regalos_update', (data) => {
            if (!data) return;
            const cfg = data.config || {};
            const sortOrder = cfg.sortOrder || 'oldest';
            const maxVisible = parseInt(cfg.maxVisible) || 6;

            let lista = [...(data.queue || [])];
            if (sortOrder === 'newest') {
                lista.sort((a, b) => b.timestamp - a.timestamp);
            } else {
                lista.sort((a, b) => a.timestamp - b.timestamp);
            }

            const visibles = lista.slice(0, maxVisible);
            let html = '';

            visibles.forEach(item => {
                const prevQty = previousCounts.get(item.uid) || 0;
                const isBump = prevQty > 0 && item.count > prevQty;
                if (prevQty === 0 && !item.completed) playBellSound();
                previousCounts.set(item.uid, item.count);

                html += `
                    <div class="order-card ${item.completed ? 'completed' : ''} ${isBump ? 'combo-bump' : ''}" id="card-${item.uid}">
                        <div class="left-block">
                            <div class="avatar-wrap">
                                <img src="${item.avatar || defaultAvatar}" class="avatar" onerror="this.src='${defaultAvatar}'">
                            </div>
                            <div class="text-col">
                                <div class="user-line">
                                    <span class="user-name">${item.userName}</span>
                                    <span class="sent-label">pidió</span>
                                </div>
                                <div class="action-pill">${item.actionText}</div>
                            </div>
                        </div>
                        <div class="right-gift-block">
                            <img src="${item.giftImage || defaultAvatar}" class="gift-icon" referrerpolicy="no-referrer" onerror="this.src='${defaultAvatar}'">
                            <span class="combo-qty">x${item.count}</span>
                        </div>
                        <div class="check-overlay-badge"><i class="fa-solid fa-check"></i> LISTO</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        });
    </script>
</body>
</html>
