<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f13; color: white; font-family: 'Segoe UI', sans-serif; padding: 35px; margin: 0; }
        .box { background: #1a1a24; border: 1px solid #333; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 1020px; margin: 0 auto; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; background: #222; padding: 15px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        
        .racha-layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
        .racha-col { flex: 1; min-width: 320px; background: #222; border: 1px solid #444; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; max-height: 580px; }
        .racha-col h3 { text-align: center; margin-top: 0; font-size: 16px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; text-transform: uppercase; }
        
        .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .user-item { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #222; }
        .user-info div { display: flex; flex-direction: column; }
        .u-name { font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 135px; }
        .u-data { font-size: 12px; font-weight: bold; }
        
        .btn-ctrl { background: #333; border: none; color: white; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .btn-del { color: #ff003c; }
        .btn-del:hover { background: #ff003c; color: white; }

        .btn-action { width: 100%; padding: 14px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; margin-top: 10px; font-size: 13.5px; }
        .btn-primary { background: #ffd700; color: black; }
        .btn-danger { background: #444; color: white; }
        .btn-danger:hover { background: #ff003c; }

        .btn-overlay { padding: 10px 14px; background: #222; color: #ffd700; font-size: 13px; font-weight: bold; border: 1px solid #ffd700; cursor: pointer; border-radius: 8px; }
        .btn-overlay:hover { background: #ffd700; color: black; }

        .search-bar { width: 100%; background: #111; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 9px 12px; font-size: 13px; box-sizing: border-box; margin-bottom: 10px; }
        .search-bar:focus { outline: none; border-color: #ffd700; }
    </style>
</head>
<body>
    <div class="box">
        <div class="top-row">
            <div><h3 style="margin: 0; color: #ffd700;"><i class="fa-solid fa-gem"></i> Gestión Top Donadores VIP</h3></div>
            <div style="display:flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn-overlay" style="color:#00ff66; border-color:#00ff66;" onclick="window.open('/top_donadores', '_blank')"><i class="fa-solid fa-eye"></i> Ver Top Actual</button>
                <button class="btn-overlay" onclick="copiarURL('/top_donadores')"><i class="fa-solid fa-link"></i> URL Actual</button>
                <button class="btn-overlay" style="color:#ffaa00; border-color:#ffaa00;" onclick="window.open('/top_guerreros', '_blank')"><i class="fa-solid fa-trophy"></i> Ver Guerreros (10)</button>
                <button class="btn-overlay" onclick="copiarURL('/top_guerreros')"><i class="fa-solid fa-link"></i> URL Guerreros</button>
            </div>
        </div>

        <div class="racha-layout">
            <!-- COLUMNA 1: RONDA ACTUAL CON BUSCADOR -->
            <div class="racha-col" style="border-color: #ffd700;">
                <div style="margin-bottom: 12px; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display:flex; gap:10px; align-items: center;">
                    <span style="font-size:12px; color:#aaa;">Mostrar Top:</span>
                    <input type="number" id="inp-vip-limit" min="1" max="10" value="2" style="width:55px; text-align:center; background:#000; color:#fff; border:1px solid #444; border-radius:4px; padding:5px;" onchange="guardarOpcionesVIP()">
                    <label style="margin:0; color:#fff; display:flex; align-items:center; gap:5px; font-size:12px; cursor:pointer;">
                        <input type="checkbox" id="inp-vip-mirror" style="width:16px; height:16px; accent-color: #00f2fe;" onchange="guardarOpcionesVIP()"> Modo Espejo
                    </label>
                </div>

                <h3 style="color:#ffd700;">Ronda Actual (<span id="count-ronda">0</span>)</h3>
                <input type="text" id="buscador-ronda" class="search-bar" placeholder="🔍 Buscar donador en la ronda actual...">
                <div class="user-list" id="lista-ronda"></div>
                
                <button class="btn-action btn-primary" onclick="cerrarRondaGlobal()"><i class="fa-solid fa-trophy"></i> Cerrar Ronda (+1 Win y Resetear Likes)</button>
                <button class="btn-action btn-danger" onclick="limpiarRonda()"><i class="fa-solid fa-eraser"></i> Limpiar Ronda Actual</button>
            </div>

            <!-- COLUMNA 2: HISTORIAL CON BUSCADOR -->
            <div class="racha-col" style="border-color: #ffaa00;">
                <h3 style="color:#ffaa00;">Historial de Victorias (<span id="count-hist">0</span>)</h3>
                <input type="text" id="buscador-historial" class="search-bar" placeholder="🔍 Buscar usuario en el historial...">
                <div class="user-list" id="lista-historial"></div>
                <button class="btn-action btn-danger" onclick="limpiarHistorial()"><i class="fa-solid fa-trash-can"></i> Limpiar Todo el Historial</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let arrRondaGlobal = [];
        let arrHistGlobal = []; 
        let limitVisibles = 25; 
        let filtroRonda = "";
        let filtroHist = ""; 

        document.getElementById('buscador-ronda').addEventListener('input', (e) => {
            filtroRonda = e.target.value.toLowerCase().trim();
            renderRonda();
        });

        document.getElementById('buscador-historial').addEventListener('input', (e) => {
            filtroHist = e.target.value.toLowerCase().trim();
            limitVisibles = 25; 
            renderHistorial();
        });

        socket.on('config_actual', (config) => {
            if(config.topVIP) {
                if(config.topVIP.displayLimit) document.getElementById('inp-vip-limit').value = config.topVIP.displayLimit;
                if(config.topVIP.mirrorMode !== undefined) document.getElementById('inp-vip-mirror').checked = config.topVIP.mirrorMode;
            }
        });

        socket.on('top_vip_data_update', (data) => {
            if(!data) return;
            arrRondaGlobal = Object.entries(data.currentRound || {}).map(([u, d]) => ({userKey: u, ...d})).sort((a,b) => b.coins - a.coins);
            arrHistGlobal = Object.entries(data.recordHistorico || {}).map(([u, d]) => ({userKey: u, ...d})).sort((a,b) => b.wins - a.wins);
            
            document.getElementById('count-ronda').innerText = arrRondaGlobal.length;
            document.getElementById('count-hist').innerText = arrHistGlobal.length;

            renderRonda();
            renderHistorial();
        });

        function renderRonda() {
            let lRonda = document.getElementById('lista-ronda'); 
            lRonda.innerHTML = '';

            let filtrados = arrRondaGlobal.filter(u => !filtroRonda || u.displayName.toLowerCase().includes(filtroRonda) || u.userKey.toLowerCase().includes(filtroRonda));

            filtrados.slice(0, 40).forEach((u) => {
                let realIndex = arrRondaGlobal.findIndex(x => x.userKey === u.userKey);
                let badge = realIndex === 0 ? '<i class="fa-solid fa-crown" style="color:gold;"></i>' : `#${realIndex + 1}`;
                let fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName)}&background=222222&color=fff&size=80&bold=true`;

                lRonda.innerHTML += `
                <div class="user-item" style="${realIndex === 0 ? 'border-color: gold;' : ''}">
                    <div class="user-info">
                        <span style="font-weight:bold; color:#888; width:22px;">${badge}</span>
                        <img src="${u.avatar || fallbackAvatar}" onerror="this.onerror=null; this.src='${fallbackAvatar}';">
                        <div><span class="u-name">${u.displayName}</span><span class="u-data" style="color:#ffd700;"><i class="fa-solid fa-coins"></i> ${u.coins.toLocaleString()}</span></div>
                    </div>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <input type="number" id="inp-coin-${u.userKey}" style="width:50px; height:24px; background:#000; color:#00ff66; border:1px solid #555; border-radius:4px; font-size:12px; padding:0 4px;" placeholder="+Cant">
                        <button class="btn-ctrl" style="color:#00ff66;" onclick="sumarCoinsRonda('${u.userKey}')"><i class="fa-solid fa-plus"></i></button>
                        <button class="btn-ctrl btn-del" onclick="eliminarRonda('${u.userKey}')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`;
            });
        }

        function renderHistorial() {
            let lHist = document.getElementById('lista-historial'); 
            lHist.innerHTML = '';
            
            let filtrados = arrHistGlobal.filter(u => !filtroHist || u.displayName.toLowerCase().includes(filtroHist) || u.userKey.toLowerCase().includes(filtroHist));
            let mostrar = filtrados.slice(0, limitVisibles);

            mostrar.forEach(u => {
                let globalRank = arrHistGlobal.findIndex(x => x.userKey === u.userKey) + 1;
                let rankColor = globalRank === 1 ? '#ffd700' : (globalRank === 2 ? '#c0c0c0' : '#888');
                let fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName)}&background=222222&color=fff&size=80&bold=true`;

                lHist.innerHTML += `
                <div class="user-item">
                    <div class="user-info">
                        <span style="font-weight:900; color:${rankColor}; width:25px;">#${globalRank}</span>
                        <img src="${u.avatar || fallbackAvatar}" onerror="this.onerror=null; this.src='${fallbackAvatar}';">
                        <div>
                            <span class="u-name">${u.displayName}</span>
                            <div style="display:flex; gap:10px;">
                                <span class="u-data" style="color:#ffaa00;"><i class="fa-solid fa-trophy"></i> ${u.wins}</span>
                                <span class="u-data" style="color:#00d2e6;"><i class="fa-solid fa-fire"></i> ${u.streak || 0}</span>
                            </div>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
                        <div style="display:flex; gap:4px; align-items:center;">
                            <span style="font-size:10px; color:#ffaa00; font-weight:bold;">WIN</span>
                            <button class="btn-ctrl" style="height:22px; width:22px;" onclick="ajustarHistorial('${u.userKey}', -1)">-</button>
                            <button class="btn-ctrl" style="height:22px; width:22px;" onclick="ajustarHistorial('${u.userKey}', 1)">+</button>
                            <button class="btn-ctrl btn-del" style="height:22px; width:22px;" onclick="eliminarHistorial('${u.userKey}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <span style="font-size:10px; color:#00d2e6; font-weight:bold;">RACHA</span>
                            <button class="btn-ctrl" style="height:22px; width:22px;" onclick="ajustarRacha('${u.userKey}', -1)">-</button>
                            <button class="btn-ctrl" style="height:22px; width:22px;" onclick="ajustarRacha('${u.userKey}', 1)">+</button>
                            <div style="width:22px;"></div>
                        </div>
                    </div>
                </div>`;
            });

            if (limitVisibles < filtrados.length) {
                lHist.innerHTML += `<button class="btn-action" style="background:#2a2a35; color:#fff;" onclick="cargarMas()">Mostrar más (${filtrados.length - limitVisibles})</button>`;
            }
        }

        function cargarMas() { limitVisibles += 25; renderHistorial(); }

        function guardarOpcionesVIP() {
            let limit = parseInt(document.getElementById('inp-vip-limit').value) || 2;
            let mirror = document.getElementById('inp-vip-mirror').checked;
            socket.emit('top_vip_guardar_opciones', { displayLimit: limit, mirrorMode: mirror });
        }

        function sumarCoinsRonda(key) {
            let input = document.getElementById('inp-coin-' + key);
            let amount = parseInt(input.value);
            if(!isNaN(amount) && amount !== 0) {
                socket.emit('top_vip_ajuste_ronda', { userKey: key, amount: amount });
                input.value = ''; 
            }
        }

        // Cierra ronda directo sin ventanas lentas
        function cerrarRondaGlobal() { socket.emit('top_cerrar_ambas_rondas'); }
        function limpiarRonda() { socket.emit('top_vip_limpiar_ronda'); }
        function limpiarHistorial() { if(confirm("🚨 ¿Borrar TODO el historial de victorias?")) socket.emit('top_vip_limpiar_historial'); }
        function eliminarRonda(key) { socket.emit('top_vip_eliminar_ronda', key); }
        function eliminarHistorial(key) { socket.emit('top_vip_eliminar_historial', key); }
        function ajustarHistorial(key, amount) { socket.emit('top_vip_ajuste_historial', { userKey: key, amount: amount }); }
        function ajustarRacha(key, amount) { socket.emit('top_vip_ajuste_racha', { userKey: key, amount: amount }); }

        function copiarURL(path) { navigator.clipboard.writeText(window.location.origin + path); alert("✅ Enlace copiado!"); }
    </script>
</body>
</html>
