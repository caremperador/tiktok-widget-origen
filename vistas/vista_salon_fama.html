<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f13; color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        .box { background: #1a1a24; border: 1px solid #333; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 800px; margin: 0 auto;}
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #222; padding: 15px; border-radius: 8px;}
        
        .racha-col { background: #222; border: 1px solid #ffd700; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; max-height: 500px;}
        .racha-col h3 { text-align: center; margin-top: 0; font-size: 16px; color: #ffd700; border-bottom: 1px solid #444; padding-bottom: 10px; text-transform: uppercase;}
        
        .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;}
        .user-list::-webkit-scrollbar { width: 5px; }
        .user-list::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        .user-item { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; gap: 10px;}
        .user-info { display: flex; align-items: center; gap: 10px; overflow: hidden; flex: 1;}
        .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover;}
        
        .gift-info { display: flex; align-items: center; gap: 8px; background: #000; padding: 4px 8px; border-radius: 6px; border: 1px solid #444;}
        .gift-img { width: 25px; height: 25px; object-fit: contain; }
        
        .u-name { font-weight: bold; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;}
        .u-data { font-size: 12px; color: #ffd700; font-weight: bold; display: flex; align-items: center; gap: 4px;}
        
        .btn-ctrl { background: #333; border: none; color: white; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center;}
        .btn-ctrl:hover { background: #555;}
        .btn-del { color: #ff003c; }
        .btn-del:hover { background: #ff003c; color: white; }

        .btn-action { width: 100%; padding: 15px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; margin-top: 15px; font-size: 14px;}
        .btn-danger { background: #444; color: white; }
        .btn-danger:hover { background: #ff003c; }

        .btn-overlay { padding: 10px 15px; background: #222; color: #ffd700; font-size: 13px; font-weight: bold; border: 1px solid #ffd700; cursor: pointer; border-radius: 8px;}
        .btn-overlay:hover { background: #ffd700; color: black;}

        /* Búsqueda */
        .search-bar { width: 100%; background: #111; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 10px 12px; font-size: 13px; box-sizing: border-box; margin-bottom: 10px; }
        .search-bar:focus { outline: none; border-color: #ffd700; }
    </style>
</head>
<body>
    <div class="box">
        <div class="top-row">
            <div><h3 style="margin: 0; color: #ffd700;"><i class="fa-solid fa-star"></i> Salón de la Fama</h3></div>
            <div style="display:flex; gap: 10px;">
                <button class="btn-overlay" style="color:#00ff66; border-color:#00ff66;" onclick="window.open('/salon_fama', '_blank')"><i class="fa-solid fa-eye"></i> Ver Overlay</button>
                <button class="btn-overlay" onclick="copiarURL()"><i class="fa-solid fa-link"></i> Copiar URL OBS</button>
            </div>
        </div>

        <p style="color:#aaa; font-size:13px; margin-top:-10px; margin-bottom: 20px;">
            Este módulo guarda automáticamente el regalo más caro enviado por cada usuario en tu directo. 
            (Regalos de 1 moneda se ignorarán si ya hay regalos de peso).
        </p>

        <div class="racha-col">
            <div style="margin-bottom: 15px; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <label style="color:#00f2fe; margin-bottom: 0; font-size: 12px; font-weight: bold;">Configuración Overlay:</label>
                <div style="display:flex; gap:10px; align-items: center; flex-wrap: wrap;">
                    
                    <span style="font-size:12px; color:#aaa;">Top:</span>
                    <input type="number" id="inp-limit" min="1" max="10" value="5" style="margin:0; width:50px; text-align:center; background:#000; color:#fff; border:1px solid #444; border-radius:4px; padding:4px;" title="Cantidad a mostrar">
                    
                    <span style="font-size:12px; color:#aaa;">Alineación:</span>
                    <select id="inp-alignment" style="margin:0; background:#000; color:#fff; border:1px solid #444; border-radius:4px; padding:4px; outline:none;">
                        <option value="left">Izquierda</option>
                        <option value="center">Centro</option>
                        <option value="right">Derecha</option>
                    </select>

                    <button class="btn-ctrl" style="width:auto; padding:0 15px; background:#00f2fe; color:black; font-size: 12px;" onclick="guardarOpciones()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                </div>
            </div>

            <h3 style="color:#ffd700;">Récords Oficiales</h3>
            
            <input type="text" id="buscador-fama" class="search-bar" placeholder="🔍 Buscar usuario en el Salón de la Fama...">

            <div class="user-list" id="lista-fama"></div>
            
            <button class="btn-action btn-danger" onclick="limpiarTodo()"><i class="fa-solid fa-trash-can"></i> Limpiar Todo el Salón</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const container = document.getElementById('lista-fama');

        let arrFamaGlobal = [];
        let limitVisibles = 20;
        let filtroTexto = "";

        socket.on('config_actual', (config) => {
            if(config.salonFama) {
                if (config.salonFama.displayLimit) document.getElementById('inp-limit').value = config.salonFama.displayLimit;
                if (config.salonFama.alignment) document.getElementById('inp-alignment').value = config.salonFama.alignment;
            }
        });

        document.getElementById('buscador-fama').addEventListener('input', (e) => {
            filtroTexto = e.target.value.toLowerCase();
            limitVisibles = 20;
            renderFama();
        });

        socket.on('salon_fama_update', (data) => {
            if(!data || !data.record) return;
            arrFamaGlobal = Object.entries(data.record).map(([u, d]) => ({userKey: u, ...d})).sort((a,b) => b.diamonds - a.diamonds);
            renderFama();
        });

        function renderFama() {
            container.innerHTML = '';

            if (arrFamaGlobal.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#666; padding: 20px; font-style:italic;">Aún no hay regalos registrados.</div>`;
                return;
            }

            let filtrados = arrFamaGlobal.filter(u => u.name.toLowerCase().includes(filtroTexto) || u.userKey.toLowerCase().includes(filtroTexto));
            let mostrar = filtrados.slice(0, limitVisibles);

            mostrar.forEach((u) => {
                let globalRank = arrFamaGlobal.findIndex(x => x.userKey === u.userKey);
                let badge = globalRank === 0 ? '<i class="fa-solid fa-crown" style="color:gold;"></i>' : `#${globalRank + 1}`;
                
                let imgRegalo = u.giftImage && u.giftImage !== "" ? `<img src="${u.giftImage}" class="gift-img">` : `<i class="fa-solid fa-gift" style="color:#aaa;"></i>`;

                container.innerHTML += `
                <div class="user-item" style="${globalRank === 0 ? 'border-color: gold; box-shadow: 0 0 10px rgba(255,215,0,0.2);' : ''}">
                    <div class="user-info">
                        <span style="font-weight:bold; color:#888; width:20px;">${badge}</span>
                        <img src="${u.avatar}">
                        <div style="display:flex; flex-direction:column; gap:2px;">
                            <span class="u-name">${u.name}</span>
                            <div class="gift-info">
                                ${imgRegalo}
                                <span class="u-data">${u.diamonds.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                    <button class="btn-ctrl btn-del" onclick="eliminarUsuario('${u.userKey}')" title="Eliminar este regalo"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            });

            if (limitVisibles < filtrados.length) {
                container.innerHTML += `
                <button class="btn-action" style="background:#2a2a35; color:#fff; border: 1px solid #444; padding: 10px; margin-top: 5px;" onclick="cargarMas()">
                    <i class="fa-solid fa-rotate-right"></i> Mostrar más resultados (${filtrados.length - limitVisibles} ocultos)
                </button>`;
            }
        }

        function cargarMas() {
            limitVisibles += 20;
            renderFama();
        }

        function guardarOpciones() {
            let limit = parseInt(document.getElementById('inp-limit').value) || 5;
            let align = document.getElementById('inp-alignment').value || 'left';
            socket.emit('salon_fama_guardar_opciones', { displayLimit: limit, alignment: align });
        }

        function limpiarTodo() { if(confirm("🚨 ¿Borrar TODO el Salón de la Fama? Esta acción es irreversible.")) socket.emit('salon_fama_limpiar'); }
        function eliminarUsuario(key) { if(confirm("¿Eliminar este regalo del Salón de la Fama?")) socket.emit('salon_fama_eliminar', key); }

        function copiarURL() { navigator.clipboard.writeText(window.location.origin + '/salon_fama'); alert("✅ Enlace copiado!"); }
    </script>
</body>
</html>
