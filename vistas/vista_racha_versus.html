<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f13; color: white; font-family: 'Segoe UI', sans-serif; padding: 35px; margin: 0; }
        .box { background: #1a1a24; border: 1px solid #333; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 1020px; margin: 0 auto 25px auto; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #222; padding: 15px; border-radius: 8px; flex-wrap: wrap; gap: 12px; }
        
        .racha-layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
        .racha-col { flex: 1; min-width: 300px; background: #222; border: 1px solid #444; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; max-height: 460px; }
        .racha-col h3 { text-align: center; margin-top: 0; font-size: 15px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; text-transform: uppercase; }
        
        .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .user-item { background: #111; padding: 9px 12px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #222; }
        .user-info div { display: flex; flex-direction: column; }
        .u-name { font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .u-data { font-size: 12px; font-weight: bold; }
        
        .btn-ctrl { background: #333; border: none; color: white; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .btn-del { color: #ff003c; }
        .btn-del:hover { background: #ff003c; color: white; }

        .btn-clear { background: #383848; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .btn-clear:hover { background: #ff003c; }

        .btn-overlay { padding: 10px 14px; background: #222; color: #00f2fe; font-size: 13px; font-weight: bold; border: 1px solid #00f2fe; cursor: pointer; border-radius: 8px; }
        .btn-overlay:hover { background: #00f2fe; color: black; }

        .search-bar { width: 100%; background: #111; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 10px 12px; font-size: 13px; box-sizing: border-box; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="top-row">
            <div style="display:flex; gap: 16px; align-items:center; flex-wrap: wrap;">
                <label style="cursor: pointer; font-weight: bold; font-size: 13px; color:#ddd;"><input type="checkbox" id="opt-name" onchange="guardarOpts()"> Mostrar Nombre</label>
                <label style="cursor: pointer; font-weight: bold; font-size: 13px; color:#ddd;"><input type="checkbox" id="opt-count" onchange="guardarOpts()"> Mostrar Copas</label>
                <label style="cursor: pointer; font-weight: bold; font-size: 13px; color:#ddd;"><input type="checkbox" id="opt-coins" onchange="guardarOpts()"> Mostrar Monedas</label>
                <label style="cursor: pointer; font-weight: bold; font-size: 13px; color:#00f2fe;"><input type="checkbox" id="opt-mirror" onchange="guardarOpts()"> Modo Espejo</label>
            </div>
            <div style="display:flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn-overlay" style="color:#ffaa00; border-color:#ffaa00;" onclick="limpiarVisual()"><i class="fa-solid fa-rotate-left"></i> Reiniciar Top Batalla Actual</button>
                <button class="btn-overlay" onclick="window.open('/racha_versus', '_blank')"><i class="fa-solid fa-eye"></i> Ver Overlay</button>
                <button class="btn-overlay" onclick="copiarURL()"><i class="fa-solid fa-link"></i> Copiar URL OBS</button>
            </div>
        </div>

        <!-- SECCIÓN 1: TOP DONADORES DE LA BATALLA ACTUAL EN VIVO -->
        <div class="racha-layout" style="margin-bottom: 25px;">
            <div class="racha-col" style="border-color: #00ff66; max-height: 260px;">
                <h3 style="color:#00ff66;"><i class="fa-solid fa-shield-halved"></i> Top Donadores Equipo 1 (Batalla Actual)</h3>
                <div class="user-list" id="lista-actual-eq1"></div>
            </div>
            <div class="racha-col" style="border-color: #ff003c; max-height: 260px;">
                <h3 style="color:#ff003c;"><i class="fa-solid fa-bolt"></i> Top Donadores Equipo 2 (Batalla Actual)</h3>
                <div class="user-list" id="lista-actual-eq2"></div>
            </div>
        </div>

        <!-- SECCIÓN 2: HISTORIAL DE VICTORIAS DE EQUIPOS -->
        <input type="text" id="buscador-historial" class="search-bar" placeholder="🔍 Buscar usuario en el historial de Salvadores o Reinicios...">

        <div class="racha-layout">
            <div class="racha-col" style="border-color: #00ff66;">
                <h3 style="color:#00ff66;"><i class="fa-solid fa-trophy"></i> Historial Salvadores (Eq 1)</h3>
                <div class="user-list" id="lista-salvadas"></div>
                <button class="btn-clear" onclick="limpiarRacha('salvadas')"><i class="fa-solid fa-trash"></i> Limpiar Historial Eq 1</button>
            </div>

            <div class="racha-col" style="border-color: #ff003c;">
                <h3 style="color:#ff003c;"><i class="fa-solid fa-trophy"></i> Historial Reinicios (Eq 2)</h3>
                <div class="user-list" id="lista-reinicios"></div>
                <button class="btn-clear" onclick="limpiarRacha('reinicios')"><i class="fa-solid fa-trash"></i> Limpiar Historial Eq 2</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let arrSalvGlobal = []; 
        let arrReinGlobal = []; 
        let filtroTexto = ""; 

        document.getElementById('buscador-historial').addEventListener('input', (e) => {
            filtroTexto = e.target.value.toLowerCase();
            renderListas();
        });

        socket.on('actualizacion_salvar', (data) => {
            if (!data) return;
            renderActualList('lista-actual-eq1', data.donatorsSalvar || [], '#00ff66');
            renderActualList('lista-actual-eq2', data.donatorsReiniciar || [], '#ff003c');
        });

        function renderActualList(containerId, list, color) {
            const el = document.getElementById(containerId);
            if (!list || list.length === 0) {
                el.innerHTML = `<div style="text-align:center; color:#666; padding:18px; font-size:13px;">Esperando donadores de este equipo...</div>`;
                return;
            }
            el.innerHTML = list.map((u, idx) => `
                <div class="user-item" style="${idx === 0 ? `border-color:${color};` : ''}">
                    <div class="user-info">
                        <span style="font-weight:900; color:${idx === 0 ? '#ffd700' : '#888'}; width:22px;">#${idx + 1}</span>
                        <img src="${u.avatar || ''}" onerror="this.style.display='none'">
                        <div>
                            <span class="u-name">${u.name}</span>
                            <span class="u-data" style="color:#ffd700;"><i class="fa-solid fa-coins"></i> ${u.coins.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        socket.on('racha_versus_update', (data) => {
            if(!data) return;
            document.getElementById('opt-name').checked = data.showName !== false;
            document.getElementById('opt-count').checked = data.showCount !== false;
            document.getElementById('opt-coins').checked = data.showCoins !== false;
            document.getElementById('opt-mirror').checked = !!data.mirrorMode;

            arrSalvGlobal = Object.values(data.salvadas || {}).sort((a,b) => b.count - a.count);
            arrReinGlobal = Object.values(data.reinicios || {}).sort((a,b) => b.count - a.count);
            renderListas();
        });

        function renderListas() {
            let lSalv = document.getElementById('lista-salvadas'); 
            lSalv.innerHTML = '';
            arrSalvGlobal.filter(u => u.displayName.toLowerCase().includes(filtroTexto)).slice(0, 30).forEach((u, i) => {
                lSalv.innerHTML += `
                <div class="user-item">
                    <div class="user-info">
                        <span style="font-weight:900; color:#888; width:22px;">#${i + 1}</span>
                        <img src="${u.avatar || ''}" onerror="this.style.display='none'">
                        <div><span class="u-name">${u.displayName}</span><span class="u-data" style="color:#00ff66;">${u.count} WINS</span></div>
                    </div>
                    <div style="display:flex;gap:5px;">
                        <button class="btn-ctrl" onclick="ajustarWin('salvadas','${u.displayName}',-1)">-</button>
                        <button class="btn-ctrl" onclick="ajustarWin('salvadas','${u.displayName}',1)">+</button>
                        <button class="btn-ctrl btn-del" onclick="eliminarUser('salvadas','${u.displayName}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });

            let lRein = document.getElementById('lista-reinicios'); 
            lRein.innerHTML = '';
            arrReinGlobal.filter(u => u.displayName.toLowerCase().includes(filtroTexto)).slice(0, 30).forEach((u, i) => {
                lRein.innerHTML += `
                <div class="user-item">
                    <div class="user-info">
                        <span style="font-weight:900; color:#888; width:22px;">#${i + 1}</span>
                        <img src="${u.avatar || ''}" onerror="this.style.display='none'">
                        <div><span class="u-name">${u.displayName}</span><span class="u-data" style="color:#ff003c;">${u.count} WINS</span></div>
                    </div>
                    <div style="display:flex;gap:5px;">
                        <button class="btn-ctrl" onclick="ajustarWin('reinicios','${u.displayName}',-1)">-</button>
                        <button class="btn-ctrl" onclick="ajustarWin('reinicios','${u.displayName}',1)">+</button>
                        <button class="btn-ctrl btn-del" onclick="eliminarUser('reinicios','${u.displayName}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });
        }

        function ajustarWin(tipo, nombre, cant) { socket.emit('racha_versus_ajuste', { tipo, name: nombre, amount: cant }); }
        function eliminarUser(tipo, nombre) { socket.emit('racha_versus_eliminar', { tipo, name: nombre }); }
        function limpiarRacha(tipo) { if(confirm(`¿Borrar historial de ${tipo}?`)) socket.emit('racha_versus_limpiar', tipo); }
        function limpiarVisual() { socket.emit('racha_versus_clear_visual'); }
        
        function guardarOpts() { 
            socket.emit('racha_versus_guardar_opciones', { 
                showName: document.getElementById('opt-name').checked, 
                showCount: document.getElementById('opt-count').checked, 
                showCoins: document.getElementById('opt-coins').checked,
                mirrorMode: document.getElementById('opt-mirror').checked
            }); 
        }
        
        function copiarURL() { navigator.clipboard.writeText(window.location.origin + '/racha_versus'); alert("✅ Enlace copiado!"); }
    </script>
</body>
</html>
