<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f13; color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        .box { background: #1a1a24; border: 1px solid #333; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 650px; margin: 0 auto; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #222; padding: 15px; border-radius: 8px; }
        
        .racha-col { background: #222; border: 1px solid #00f2fe; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; max-height: 540px; }
        .racha-col h3 { text-align: center; margin-top: 0; font-size: 16px; color: #00f2fe; border-bottom: 1px solid #444; padding-bottom: 10px; text-transform: uppercase; }
        
        .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
        .user-list::-webkit-scrollbar { width: 5px; }
        .user-list::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        .user-item { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
        .user-info div { display: flex; flex-direction: column; }
        .u-name { font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
        .u-data { font-size: 12px; color: #ff003c; font-weight: bold; }
        
        .btn-ctrl { background: #333; border: none; color: white; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .btn-del { color: #ff003c; }
        .btn-del:hover { background: #ff003c; color: white; }

        .btn-action { width: 100%; padding: 14px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; margin-top: 12px; font-size: 14px; }
        .btn-danger { background: #ff003c; color: white; }
        .btn-danger:hover { filter: brightness(1.15); }

        .btn-overlay { padding: 10px 15px; background: #222; color: #ffd700; font-size: 13px; font-weight: bold; border: 1px solid #ffd700; cursor: pointer; border-radius: 8px; }
        .btn-overlay:hover { background: #ffd700; color: black; }

        .opt-box { margin-bottom: 15px; background: #14141d; padding: 12px 15px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .opt-check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: #eee; }
        .opt-check input { width: 17px; height: 17px; accent-color: #00f2fe; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="top-row">
            <div>
                <h3 style="margin: 0; color: #00f2fe;"><i class="fa-solid fa-hand-pointer"></i> Gestión Top Tap Tap (100% RAM)</h3>
                <span style="font-size: 11px; color: #00ff66;">⚡ Optimizado: Nunca escribe en data.json para no saturar Render</span>
            </div>
            <div style="display:flex; gap: 10px;">
                <button class="btn-overlay" style="color:#00ff66; border-color:#00ff66;" onclick="window.open('/top_likes', '_blank')"><i class="fa-solid fa-eye"></i> Ver Overlay</button>
                <button class="btn-overlay" onclick="copiarURL()"><i class="fa-solid fa-link"></i> Copiar URL OBS</button>
            </div>
        </div>

        <div class="racha-col">
            <div class="opt-box">
                <label class="opt-check">
                    <input type="checkbox" id="inp-likes-keep" onchange="guardarOpcionesLikes()">
                    <span>🔒 No formatear Top Likes cuando cierre ronda en Top Donadores</span>
                </label>
                <label class="opt-check">
                    <input type="checkbox" id="inp-likes-mirror" onchange="guardarOpcionesLikes()">
                    <span>↔️ Modo Espejo (Diseño invertido en OBS)</span>
                </label>
            </div>

            <h3>Ronda Actual en Vivo (<span id="count-tappers">0</span>)</h3>
            <div class="user-list" id="lista-ronda"></div>
            
            <button class="btn-action btn-danger" onclick="limpiarRonda()"><i class="fa-solid fa-eraser"></i> Reiniciar Top Likes a 0 Ahora</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        socket.on('config_actual', (config) => {
            if(config.topLikes) {
                document.getElementById('inp-likes-mirror').checked = !!config.topLikes.mirrorMode;
                document.getElementById('inp-likes-keep').checked = !!config.topLikes.keepOnGlobalClose;
            }
        });

        socket.on('top_likes_data_update', (data) => {
            if(!data) return;
            if (data.mirrorMode !== undefined) document.getElementById('inp-likes-mirror').checked = !!data.mirrorMode;
            if (data.keepOnGlobalClose !== undefined) document.getElementById('inp-likes-keep').checked = !!data.keepOnGlobalClose;

            let lRonda = document.getElementById('lista-ronda'); 
            lRonda.innerHTML = '';
            
            let arrRonda = Object.entries(data.currentRound || {}).map(([u, d]) => ({userKey: u, ...d})).sort((a,b) => b.likes - a.likes);
            document.getElementById('count-tappers').innerText = arrRonda.length;
            
            arrRonda.slice(0, 30).forEach((u, index) => {
                let badge = index === 0 ? '<i class="fa-solid fa-crown" style="color:gold;"></i>' : `#${index + 1}`;
                lRonda.innerHTML += `
                <div class="user-item" style="${index === 0 ? 'border-color: gold;' : ''}">
                    <div class="user-info">
                        <span style="font-weight:bold; color:#888; width:22px;">${badge}</span>
                        <img src="${u.avatar || ''}" onerror="this.style.display='none'">
                        <div><span class="u-name">${u.displayName}</span><span class="u-data"><i class="fa-solid fa-heart"></i> ${u.likes.toLocaleString()}</span></div>
                    </div>
                    <button class="btn-ctrl btn-del" onclick="eliminarRonda('${u.userKey}')"><i class="fa-solid fa-xmark"></i></button>
                </div>`;
            });
        });

        function guardarOpcionesLikes() {
            socket.emit('top_likes_guardar_opciones', {
                mirrorMode: document.getElementById('inp-likes-mirror').checked,
                keepOnGlobalClose: document.getElementById('inp-likes-keep').checked
            });
        }

        function limpiarRonda() {
            socket.emit('top_likes_limpiar_ronda');
        }
        function eliminarRonda(key) {
            socket.emit('top_likes_eliminar_ronda', key);
        }

        function copiarURL() { navigator.clipboard.writeText(window.location.origin + '/top_likes'); alert("✅ Enlace copiado!"); }
    </script>
</body>
</html>
